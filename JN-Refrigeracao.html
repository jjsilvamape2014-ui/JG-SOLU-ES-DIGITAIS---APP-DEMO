<meta name="theme-color" content="#0b3d91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--ink:#1f2430;--muted:#8a8f9c;--line:#e7e9ee;
  --brand:#0b3d91;--cold:#2f5fb3;--cold-soft:#e8f1f8;--r410:#d9536f;--r410-soft:#f6e7ea;
  --ok:#3e9a57;--ok-soft:#e3efe6;--warn:#c9962a;--warn-soft:#fbf3e6;
  --display:"Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:6;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.top .lg{width:44px;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.top .lg img{width:100%;height:100%;object-fit:contain;background:transparent}
.top .lg svg{width:28px;height:28px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;color:var(--brand);flex:1;min-width:0;overflow:hidden;}
.top small{display:block;font-family:var(--body);font-size:12px;white-space:normal;line-height:1.25;opacity:.8;text-transform:none;letter-spacing:0;font-weight:500;margin-top:3px}
main{flex:1;padding:14px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.view{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:2px 0 0;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:19px;margin:8px 0 -2px}
.sub{color:var(--muted);margin:0;font-size:14px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.strip{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.daynav{display:flex;align-items:center;gap:10px}
.daynav .dn{flex:1;text-align:center;min-width:0}
.job,.cli,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.job{padding:12px 14px;display:grid;grid-template-columns:54px 1fr;gap:4px 12px}
.job .hr{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--cold);padding-top:2px}
.who{font-weight:600;text-align:left}
.what{font-size:13.5px;color:var(--muted)}
.job .row{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-later{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.c-late,.c-bad{background:var(--r410-soft);color:var(--r410)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-now{background:var(--cold-soft);color:var(--cold)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.sq{width:42px;height:42px;font-size:22px;padding:0}
.btn-wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn-pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-main{background:var(--brand);border-color:var(--brand);color:#fff;width:100%;padding:13px;font-size:16px;border-radius:12px}
.btn-main.wa{background:#1fa855;border-color:#1fa855}
.btn-danger{color:var(--r410)}
.link{background:none;border:0;padding:0;color:var(--cold);font-weight:600}
.who.link{color:var(--ink)}
.hero{background:var(--r410);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.hero b{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.cli{padding:12px 14px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.cli .info{flex:1;min-width:0}
.nm{font-weight:600}
.meta{font-size:13px;color:var(--muted)}
.months{font-family:var(--mono);font-size:13px;color:var(--r410);white-space:nowrap}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.search,.form input,.form select,.form textarea,.sheet input,.sheet select,.sheet textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink);min-width:0}
.search{background:var(--surface)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.f{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:600}
.f:last-child{border-bottom:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px}
.total b{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.tl>div,.tl>button{display:grid;grid-template-columns:86px 1fr auto;gap:10px;padding:10px 0;border:0;border-bottom:1px solid var(--line);font-size:14px;background:none;width:100%;text-align:left;align-items:center}
.tl>*:last-child{border-bottom:0}
.tl time{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.btu{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;color:var(--cold)}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.receipt .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.receipt .hd img{max-height:72px;max-width:110px;object-fit:contain}
.receipt .ln{display:flex;justify-content:space-between;gap:12px}
.receipt .mono{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

function telaLogin(modo,msg){const L=$("#login");if(!modo){L.hidden=true;L.innerHTML="";return}L.hidden=false;

 if(modo==="carregando"){L.innerHTML=`<div class="box" style="text-align:center">${logo}<p class="sub">Carregando seus dados…</p></div>`;return}
 const novo=modo==="criar";
 L.innerHTML=`<form class="box" id="f-login">${logo}<h2 style="text-align:center">${novo?"Criar acesso":"Entrar"}</h2>
 <label>E-mail<input id="l-email" type="email" autocomplete="email" required></label>
 <label>Senha<input id="l-senha" type="password" autocomplete="${novo?"new-password":"current-password"}" minlength="6" required></label>
 <div class="msg" id="l-msg">${esc(msg||"")}</div>
 <button class="btn btn-main" type="submit">${novo?"Criar e entrar":"Entrar"}</button>
 <button class="link" type="button" data-login="${novo?"entrar":"criar"}">${novo?"Já tenho acesso":"Primeiro acesso? Criar conta"}</button>
 ${novo?"":`<button class="link" type="button" data-login="reset">Esqueci a senha</button>`}
 ${credito()}</form>`;
 $("#f-login").onsubmit=async e=>{e.preventDefault();const em=$("#l-email").value.trim(),se=$("#l-senha").value,m=$("#l-msg");m.className="msg";m.textContent="Aguarde…";
  try{novo?await fb.auth.createUserWithEmailAndPassword(em,se):await fb.auth.signInWithEmailAndPassword(em,se)}catch(err){m.textContent=ERROS[err.code]||("Erro: "+(err.code||err.message))}};
 L.querySelectorAll("[data-login]").forEach(b=>b.onclick=async()=>{const k=b.dataset.login;
  if(k==="reset"){const em=$("#l-email").value.trim(),m=$("#l-msg");if(!em){m.textContent="Digite seu e-mail acima.";return}
   try{await fb.auth.sendPasswordResetEmail(em);m.className="msg ok";m.textContent="Enviamos um link para criar uma senha nova. Veja seu e-mail."}catch(err){m.className="msg";m.textContent=ERROS[err.code]||err.code}return}
  telaLogin(k)})}
function avisoDoDia(){try{const k="jn_aviso_dia";if(localStorage.getItem(k)===hoje())return;const al=alertas(),n=al.venc.length+al.prox.length;if(!n)return;localStorage.setItem(k,hoje());
 setTimeout(()=>{if($("#sheet").innerHTML||!$("#login").hidden)return;abrir(`<div style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center"><span class="aviso-ic" style="width:56px;height:56px">${IC.snow}</span><h2>Hora da manutenção</h2>
 <p class="sub">${al.venc.length?`${al.venc.length} cliente${al.venc.length>1?"s estão":" está"} com a limpeza vencida`:""}${al.venc.length&&al.prox.length?" e ":""}${al.prox.length?`${al.prox.length} vence${al.prox.length>1?"m":""} nos próximos ${D.cfg.antecedencia||15} dias`:""}.</p></div>
 <button class="btn btn-main" data-act="tab" data-v="alertas">Ver e avisar clientes</button><button class="btn" data-act="fechar">Depois</button>`)},700)}catch(e){}}
function iniciar(){
 if(window.firebase){try{firebase.initializeApp(FB);fb.auth=firebase.auth();fb.db=firebase.firestore();fb.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});fb.on=true}catch(e){fb.on=false}}
 if(!fb.on){render();avisoDoDia();return}
 telaLogin("carregando");
 fb.auth.onAuthStateChanged(u=>{fb.unsub.forEach(f=>f());fb.unsub=[];base=null;fb.ref=null;fb.user=u;
  if(u){telaLogin("carregando");ouvir(u.uid)}else telaLogin("entrar")})}
function sair(){fb.unsub.forEach(f=>f());fb.unsub=[];base=null;fb.ref=null;try{localStorage.removeItem(KEY)}catch(e){}D=carregar();fb.auth.signOut()}

/* ---------- regras ---------- */
const cliente=id=>D.clientes.find(c=>c.id===id);
const serv=id=>D.servicos.find(s=>s.id===id);
const pnome=n=>String(n||"").split(" ")[0];
function tpl(t,c,x){x=x||{};return String(t||"").replace(/\{(\w+)\}/g,(m,k)=>({nome:pnome(c&&c.nome),empresa:D.cfg.empresa,tecnico:D.cfg.tecnico||"o técnico",...x})[k]??m)}
function ultima(c){let u="";D.servicos.forEach(s=>{if(s.cliente===c.id&&s.status==="feito"&&LIMPA.includes(s.tipo)&&s.data>u)u=s.data});return u}
const temAgendado=c=>D.servicos.some(s=>s.cliente===c.id&&s.status!=="feito"&&s.data>=hoje());
function valorPadrao(tipo,n){const p=+D.cfg.precos[tipo]||0;return POR_APARELHO.includes(tipo)?p*Math.max(1,n||1):p}
function alertas(){const iv=+D.cfg.intervalo||6,venc=[],prox=[];
 D.clientes.forEach(c=>{const u=ultima(c);if(!u||temAgendado(c))return;const due=addM(u,iv);
  if(due<=hoje())venc.push({c,u,m:meses(u)});else if(due<=addD(hoje(),+D.cfg.antecedencia||15))prox.push({c,u,due,dias:Math.round((dt(due)-dt(hoje()))/86400000)})});
 venc.sort((a,b)=>a.u.localeCompare(b.u));prox.sort((a,b)=>a.due.localeCompare(b.due));return{venc,prox}}
function resumoAps(c,ids){const aps=c.aparelhos.filter(a=>!ids||ids.includes(a.id));if(!aps.length)return "sem aparelho cadastrado";
 const g={};aps.forEach(a=>g[a.btu]=(g[a.btu]||0)+1);return Object.entries(g).map(([b,n])=>(n>1?n+"× ":"")+b+" BTU").join(", ")}

function vInicio(){const d=hoje(),{venc}=alertas(),lst=D.servicos.filter(s=>s.data===d),feitos=D.servicos.filter(s=>s.status==="feito");
 const prev=lst.reduce((a,s)=>a+(+s.valor||0),0),rec=feitos.filter(s=>s.data.slice(0,7)===d.slice(0,7)&&s.pago).reduce((a,s)=>a+(+s.valor||0),0),aRec=feitos.filter(s=>!s.pago);
 const pend=lst.filter(s=>s.status!=="feito").length;
 const T=(act,attrs,tint,ic,cor,label,badge,off)=>`<button class="tile ${tint}${off?" off":""}" data-act="${act}" ${attrs}><span class="ic" style="color:${cor}">${IC[ic]}${badge?`<b class="tb">${badge}</b>`:""}</span><span>${label}</span></button>`;
 const K=(l,v,t)=>`<div class="kpi ${t}"><small>${l}</small><b>${v}</b></div>`;
 const {prox}=alertas();const lembrar=[...venc.map(x=>({...x,txt:x.m+" meses sem limpeza",cls:"c-bad"})),...prox.map(x=>({...x,txt:x.dias===0?"vence hoje":"vence em "+x.dias+" dia"+(x.dias>1?"s":""),cls:"c-warn"}))];
 const aviso=lembrar.length?`<div class="aviso"><div class="aviso-hd"><span class="aviso-ic">${IC.snow}</span><div><b>Hora da manutenção</b><small>${lembrar.length} cliente${lembrar.length>1?"s":""} para chamar</small></div></div>
  ${lembrar.slice(0,3).map(x=>`<div class="aviso-it"><div><b>${esc(x.c.nome)}</b><small>${esc(resumoAps(x.c))}</small></div><span class="chip ${x.cls}">${x.txt}</span><button class="btn btn-wa" data-act="avisar" data-id="${x.c.id}">Avisar</button></div>`).join("")}
  ${lembrar.length>3?`<button class="link" data-act="tab" data-v="alertas">Ver todos os ${lembrar.length}</button>`:""}</div>`:"";
 return `<section class="view home">${demoBanner()}${aviso}
 <h3 class="sec">Agenda</h3><div class="grid3">
  ${T("tab",'data-v="hoje"',"t-mauve","cal","#2f5fb3","Ver agenda",pend)}
  ${T("agendar",`data-data="${d}"`,"t-slate","calplus","#2f5fb3","Agendar serviço")}
  ${T("novaOS","","t-sky","os","#2f5fb3","Nova ordem de serviço")}
 </div><hr>
 <h3 class="sec">Ações rápidas</h3><div class="grid3">
  ${T("tab",'data-v="alertas"',"t-rose","snow","#d9708a","Manutenções",venc.length+prox.length,!(venc.length+prox.length))}
  ${T("rotaDia","","t-aqua","pin","#3d9a8f","Rota do próximo",0,!pend)}
  ${T("tab",'data-v="clientes"',"t-lav","users","#5a3fa0","Ver clientes")}
  ${T("editCliente","","t-cream","userplus","#e2a93c","Novo cliente")}
  ${T("tab",'data-v="mais"',"t-mint","wallet","#3e9a57","A receber",aRec.length,!aRec.length)}
  ${T("ultimoRecibo","","t-slate","receipt","#2f5fb3","Último recibo",0,!feitos.length)}
 </div><hr>
 <h3 class="sec">Indicadores</h3><div class="kpis">
  ${K("Serviços hoje",lst.length,"t-sky")}${K("Previsto hoje",brl(prev),"t-mint")}${K("Recebido no mês",brl(rec),"t-lav")}${K("Limpezas vencidas",venc.length,"t-rose")}
 </div>${credito()}</section>`}
function cardServ(s){const c=cliente(s.cliente);if(!c)return"";
 const chip=s.status==="feito"?["c-ok","Feito"]:s.data<hoje()?["c-late","Atrasado"]:["c-later","Agendado"];
 return `<article class="job"><div class="hr">${esc(s.hora||"--:--")}</div><div><button class="who link" data-act="cliente" data-id="${c.id}">${esc(c.nome)}</button><div class="what">${esc(s.tipo)} · ${esc(resumoAps(c,s.aparelhos))}${c.bairro?" · "+esc(c.bairro):""}</div></div>
 <div class="row"><span class="chip ${chip[0]}">${chip[1]}</span>
 ${c.end?`<a class="btn" target="_blank" rel="noopener" href="${maps(c)}">Rota</a>`:""}
 ${c.tel&&s.status!=="feito"?`<a class="btn btn-wa" target="_blank" rel="noopener" href="${wa(c.tel,tpl(D.cfg.msgConfirma,c,{dia:diaNome(s.data).toLowerCase(),hora:s.hora||""}))}">Confirmar</a>`:""}
 ${s.status==="feito"?`<button class="btn" data-act="recibo" data-id="${s.id}">Recibo</button>`:`<button class="btn btn-pri" data-act="concluir" data-id="${s.id}">Concluir</button><button class="btn" data-act="agendar" data-id="${s.id}">Editar</button>`}</div></article>`}

function vHoje(){const d=st.dia,lst=D.servicos.filter(s=>s.data===d).sort((a,b)=>(a.hora||"99").localeCompare(b.hora||"99"));
 const prev=lst.reduce((a,s)=>a+(+s.valor||0),0),feitos=lst.filter(s=>s.status==="feito").length;
 return `<section class="view">${demoBanner()}
 <div class="daynav"><button class="btn sq" data-act="dia" data-n="-1" aria-label="Dia anterior">‹</button>
  <div class="dn"><h2>${d===hoje()?"Hoje":DIAS[dt(d).getDay()]}</h2><p class="sub">${br(d)}${d!==hoje()?` · <button class="link" data-act="hojeDia">voltar para hoje</button>`:""}</p></div>
  <button class="btn sq" data-act="dia" data-n="1" aria-label="Próximo dia">›</button></div>
 <div class="strip"><div class="stat"><b>${lst.length}</b><small>serviços · ${feitos} feito${feitos===1?"":"s"}</small></div><div class="stat"><b>${brl(prev)}</b><small>previsto no dia</small></div></div>
 ${lst.length?lst.map(cardServ).join(""):`<div class="empty">Nenhum serviço neste dia.</div>`}
 </section><button class="fab" data-act="agendar" data-data="${d}">+ Agendar</button>`}

function vAlertas(){const {venc,prox}=alertas();const parado=venc.reduce((a,x)=>a+valorPadrao("Limpeza completa",x.c.aparelhos.length),0);
 const item=(x,tag)=>`<article class="cli"><div class="info"><button class="nm link who" data-act="cliente" data-id="${x.c.id}">${esc(x.c.nome)}</button><div class="meta">${esc(resumoAps(x.c))} · última em ${br(x.u)}${x.c.avisado?` · avisado em ${br(x.c.avisado)}`:""}</div></div>
  <div class="side">${tag}<button class="btn btn-wa" data-act="avisar" data-id="${x.c.id}">Avisar</button></div></article>`;
 return `<section class="view"><h2>Limpeza vencida</h2><p class="sub">Clientes com mais de ${D.cfg.intervalo} meses sem limpeza e sem nada agendado.</p>
 ${venc.length?`<div class="hero"><b>${brl(parado)}</b><span>em serviços esperando você chamar ${venc.length} cliente${venc.length>1?"s":""}</span></div>${venc.map(x=>item(x,`<span class="months">${x.m} meses</span>`)).join("")}`
  :`<div class="empty">Nenhum cliente com limpeza vencida.</div>`}
 ${prox.length?`<h3>Chegando a hora (próximos ${D.cfg.antecedencia||15} dias)</h3>${prox.map(x=>item(x,`<span class="chip c-warn">${x.dias===0?"hoje":"em "+x.dias+" dia"+(x.dias>1?"s":"")}</span>`)).join("")}`:""}
 </section>`}

function vClientes(){return `<section class="view"><h2>Clientes</h2>
 <input class="search" id="q" type="search" placeholder="Buscar por nome, bairro ou telefone" value="${esc(st.q)}">
 <div id="cl" style="display:flex;flex-direction:column;gap:10px">${listaClientes()}</div></section><button class="fab" data-act="editCliente">+ Cliente</button>`}
function listaClientes(){const q=st.q.toLowerCase().trim();const l=D.clientes.filter(c=>!q||(c.nome+" "+c.bairro+" "+c.tel).toLowerCase().includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
 if(!l.length)return `<div class="empty">${q?"Nenhum cliente encontrado.":"Nenhum cliente ainda. Toque em + Cliente."}</div>`;
 return l.map(c=>{const u=ultima(c),m=u?meses(u):null,venc=u&&addM(u,+D.cfg.intervalo||6)<=hoje();

 <div class="btns">${c.tel?`<a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/${fone(c.tel)}">WhatsApp</a>`:""}${c.end?`<a class="btn" target="_blank" rel="noopener" href="${maps(c)}">Rota</a>`:""}<button class="btn" data-act="editCliente" data-id="${c.id}">Editar</button></div>

 </section>`}

function novoRascunho(cli){const c=cliente(cli);const tipo="Limpeza completa";return{cliente:cli||"",data:hoje(),tipo,aparelhos:c?c.aparelhos.map(a=>a.id):[],checks:null,valor:c?valorPadrao(tipo,c.aparelhos.length):"",valorManual:false,pagamento:"Pix",obs:""}}
function vOS(){if(!st.os)st.os=novoRascunho("");const f=st.os,c=cliente(f.cliente);const itens=CHECK[f.tipo]||[];const checks=f.checks||itens;
 return `<section class="view"><h2>Ordem de serviço</h2><p class="sub">OS nº ${pad4(D.nextOS)}${f.servicoId?" · a partir do agendamento":""}</p>
 <div class="form">
  <label class="f">Cliente<select id="os-cli" data-os="1"><option value="">Escolha o cliente</option>${D.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(x=>`<option value="${x.id}"${x.id===f.cliente?" selected":""}>${esc(x.nome)}</option>`).join("")}</select></label>

 </div>
 ${c?`<h3>Aparelhos atendidos</h3><div class="form">${c.aparelhos.map(a=>`<label class="check"><input type="checkbox" class="os-ap" data-os="1" value="${a.id}"${f.aparelhos.includes(a.id)?" checked":""}>${esc(a.btu)} BTU · ${esc([a.modelo,a.local].filter(Boolean).join(" · "))}</label>`).join("")||`<p class="sub" style="padding:10px 0">Cliente sem aparelho. <button class="link" data-act="cliente" data-id="${c.id}">Cadastrar</button></p>`}</div>`:""}

 <div class="form">
  <div class="f2"><label class="f">Valor (R$)<input id="os-valor" inputmode="decimal" value="${esc(f.valor)}"></label>
  <label class="f">Pagamento<select id="os-pag">${PAGS.map(p=>`<option${p===f.pagamento?" selected":""}>${p}</option>`).join("")}</select></label></div>
  <label class="f">Observações<textarea id="os-obs" rows="2" placeholder="Peça trocada, recomendação ao cliente…">${esc(f.obs)}</textarea></label>

 <button class="btn btn-main" data-act="salvarOS">Concluir e gerar recibo</button>
 ${f.servicoId||f.cliente?`<button class="btn" data-act="limparOS">Descartar esta OS</button>`:""}
 </section>`}
function lerOS(){const f=st.os;f.cliente=$("#os-cli").value;f.data=$("#os-data").value||hoje();f.tipo=$("#os-tipo").value;
 f.aparelhos=$$(".os-ap:checked").map(x=>x.value);f.checks=$$(".os-ck:checked").map(x=>x.value);f.valor=$("#os-valor").value;f.pagamento=$("#os-pag").value;f.obs=$("#os-obs").value}

function reciboTexto(s){const c=cliente(s.cliente)||{nome:"",aparelhos:[]};const cf=D.cfg;
 return [`*${cf.empresa}*`,`Recibo · OS ${pad4(s.os)} · ${br(s.data)}`,"",`Cliente: ${c.nome}`,`Serviço: ${s.tipo}`,`Aparelho(s): ${resumoAps(c,s.aparelhos)}`,
  ...(s.checklist&&s.checklist.length?["Feito:",...s.checklist.map(x=>"✓ "+x)]:[]),s.obs?`Obs.: ${s.obs}`:"","",
  `Valor: ${brl(s.valor)} · ${s.pago?s.pagamento:"a receber"}`,cf.garantia?`Garantia do serviço: ${cf.garantia} dias`:"",
  LIMPA.includes(s.tipo)?`Próxima limpeza sugerida: ${br(addM(s.data,+cf.intervalo||6))}`:"","",[cf.tecnico,cf.whats].filter(Boolean).join(" · ")].filter((x,i,a)=>x!==""||a[i-1]!=="").join("\n").trim()}
function vRecibo(){const s=serv(st.reciboId);if(!s){st.view="hoje";return vHoje()}const c=cliente(s.cliente)||{nome:"(cliente removido)",aparelhos:[]};const cf=D.cfg;
 return `<section class="view"><button class="link" style="align-self:flex-start" data-act="tab" data-v="inicio">‹ Início</button><h2>Recibo</h2>
 <div class="receipt"><div class="hd"><div><b>${esc(cf.empresa)}</b><div class="mono">OS ${pad4(s.os)} · ${br(s.data)}</div></div>${cf.logo?`<img src="${cf.logo}" alt="">`:""}</div>
  <div class="ln"><span>${esc(c.nome)}</span><span class="meta">${esc(c.bairro||"")}</span></div>
  <div class="ln"><span>${esc(s.tipo)} · ${esc(resumoAps(c,s.aparelhos))}</span><b>${brl(s.valor)}</b></div>
  ${s.checklist&&s.checklist.length?`<ul>${s.checklist.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
  ${s.obs?`<div class="meta">Obs.: ${esc(s.obs)}</div>`:""}
  <div class="ln meta"><span>Pagamento</span><span>${s.pago?esc(s.pagamento):"<b style='color:var(--r410)'>a receber</b>"}</span></div>
  ${cf.garantia?`<div class="ln meta"><span>Garantia</span><span>${cf.garantia} dias</span></div>`:""}
  ${LIMPA.includes(s.tipo)?`<div class="ln meta"><span>Próxima limpeza sugerida</span><span>${br(addM(s.data,+cf.intervalo||6))}</span></div>`:""}
 </div>
 ${c.tel?`<a class="btn btn-main wa" target="_blank" rel="noopener" href="${wa(c.tel,reciboTexto(s))}">Enviar recibo no WhatsApp</a>`:`<p class="sub">Cadastre o telefone do cliente para enviar pelo WhatsApp.</p>`}
 <div class="btns"><button class="btn" data-act="copiar" data-id="${s.id}">Copiar texto</button>${s.pago?"":`<button class="btn" data-act="pago" data-id="${s.id}">Marcar como pago</button>`}<button class="btn btn-danger" data-act="excluirServ" data-id="${s.id}">Excluir</button></div>
 <p class="hint">${LIMPA.includes(s.tipo)?"A próxima limpeza já entra nos alertas, sem você anotar nada.":""}</p></section>`}

function vMais(){const cf=D.cfg,mes=hoje().slice(0,7);const feitos=D.servicos.filter(s=>s.status==="feito");
 const recMes=feitos.filter(s=>s.data.slice(0,7)===mes&&s.pago).reduce((a,s)=>a+(+s.valor||0),0);const aRec=feitos.filter(s=>!s.pago);
 const q=(k,l,t,extra)=>`<label class="f">${l}<input data-cfg="${k}" type="${t||"text"}" value="${esc(cf[k])}" ${extra||""}></label>`;
 return `<section class="view">${demoBanner()}<h2>Ajustes</h2>
 <h3>Resumo do mês</h3>
 <div class="strip"><div class="stat"><b>${brl(recMes)}</b><small>recebido em ${br(hoje()).slice(3)}</small></div><div class="stat"><b style="color:var(--r410)">${brl(aRec.reduce((a,s)=>a+(+s.valor||0),0))}</b><small>a receber · ${aRec.length} OS</small></div></div>
 ${aRec.length?`<div class="tl">${aRec.map(s=>`<div><time>${br(s.data)}</time><span>${esc((cliente(s.cliente)||{}).nome||"")} · ${brl(s.valor)}</span><button class="btn" data-act="pago" data-id="${s.id}">Pago</button></div>`).join("")}</div>`:""}
 <h3>Sua empresa</h3>
 <div class="form">
  <div class="f"><span>Logo</span><div class="logo-up"><div class="prev">${cf.logo?`<img src="${cf.logo}" alt="Logo">`:`<span class="hint">sem logo</span>`}</div><div class="btns" style="flex:1"><button class="btn" data-act="logo">${cf.logo?"Trocar":"Enviar logo"}</button>${cf.logo?`<button class="btn btn-danger" data-act="tirarLogo">Remover</button>`:""}</div></div></div>
  ${q("empresa","Nome da empresa")}${q("tecnico","Seu nome (aparece nas mensagens)")}${q("whats","Seu WhatsApp (aparece no recibo)","tel")}${q("cidade","Cidade (usada na rota)")}
  <label class="f">Cor do app<input data-cfg="cor" type="color" value="${esc(cf.cor)}" style="height:44px;padding:4px"></label>
 </div>
 <h3>Regras</h3>
 <div class="form"><div class="f2" style="grid-template-columns:1fr 1fr 1fr">${q("intervalo","Limpeza a cada (meses)","number",'min="1" max="24"')}${q("antecedencia","Avisar com (dias de antecedência)","number",'min="0" max="60"')}${q("garantia","Garantia (dias)","number",'min="0"')}</div>
  <div class="f"><span>Preço padrão (R$)</span><div class="f2">${TIPOS.map(t=>`<label class="f" style="border:0;padding:4px 0">${t}${POR_APARELHO.includes(t)?" · por aparelho":""}<input data-preco="${t}" inputmode="decimal" value="${esc(cf.precos[t])}"></label>`).join("")}</div></div></div>
 <h3>Mensagens do WhatsApp</h3>
 <div class="form"><label class="f">Aviso de limpeza vencida<textarea data-cfg="msgAlerta" rows="4">${esc(cf.msgAlerta)}</textarea></label>
  <label class="f">Confirmação de horário<textarea data-cfg="msgConfirma" rows="3">${esc(cf.msgConfirma)}</textarea></label>
  <p class="hint" style="padding-bottom:8px">Use <code>{nome}</code>, <code>{tecnico}</code>, <code>{empresa}</code>, <code>{data}</code>, <code>{meses}</code>, <code>{dia}</code> e <code>{hora}</code>. O app troca pelos dados certos.</p></div>
 ${fb.user?`<h3>Conta</h3><div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
  <div class="sync"><i class="${navigator.onLine?"":"off"}"></i>${navigator.onLine?"Dados salvos na nuvem":"Sem internet: as mudanças ficam no aparelho e sobem quando a conexão voltar"}</div>
  <p class="sub">Entrou como ${esc(fb.user.email)}</p><button class="btn" data-act="sair">Sair da conta</button></div>`:""}
 <h3>Backup</h3>
 <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><p class="sub">${fb.user?"Os dados já ficam na nuvem. O backup é uma cópia extra, se quiser guardar no Google Drive.":"Os dados ficam guardados neste celular. Faça um backup toda semana e guarde o arquivo no WhatsApp ou no Google Drive."}</p>
  <div class="btns"><button class="btn btn-pri" data-act="exportar">Salvar backup</button><button class="btn" data-act="importar">Restaurar backup</button></div></div>
 ${credito()}</section>`}

/* ---------- janelas ---------- */
function abrir(html){$("#sheet").innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog">${html}</div></div>`;const f=$("#sheet input:not([type=hidden]),#sheet select");}
function fechar(){$("#sheet").innerHTML="";if(fb.pend)setTimeout(renderSeguro,50)}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function confirma(el,fn){if(el.dataset.ok==="1")return fn();el.dataset.ok="1";const t=el.textContent;el.textContent="Toque de novo para confirmar";setTimeout(()=>{el.dataset.ok="";el.textContent=t},3000)}
const opt=(arr,v)=>arr.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");

/* ---------- ações ---------- */
const A={
 buscar:()=>{st.view="clientes";render();setTimeout(()=>{const q=$("#q");q&&q.focus()},50)},
 rotaDia:()=>{const s=D.servicos.filter(x=>x.data===hoje()&&x.status!=="feito").sort((a,b)=>(a.hora||"99").localeCompare(b.hora||"99"))[0];const c=s&&cliente(s.cliente);
  if(!c)return toast("Nenhum serviço pendente hoje.");if(!c.end)return toast("Cliente sem endereço cadastrado.");window.open(maps(c),"_blank","noopener")},
 ultimoRecibo:()=>{const s=D.servicos.filter(x=>x.status==="feito").sort((a,b)=>(b.os||0)-(a.os||0))[0];if(!s)return toast("Nenhuma OS concluída ainda.");st.reciboId=s.id;st.view="recibo";render();scrollTo(0,0)},
 tab:el=>{fechar();st.view=el.dataset.v;if(st.view==="hoje")st.dia=st.dia||hoje();render();scrollTo(0,0)},
 dia:el=>{st.dia=addD(st.dia,+el.dataset.n);render()},
 hojeDia:()=>{st.dia=hoje();render()},
 cliente:el=>{st.view="cliente";st.cli=el.dataset.id;fechar();render();scrollTo(0,0)},
 agendar:el=>{const s=el.dataset.id?serv(el.dataset.id):null;const cli=s?s.cliente:(el.dataset.cli||"");
  abrir(`<h2>${s?"Editar agendamento":"Agendar serviço"}</h2>
  <label>Cliente<select id="ag-cli"><option value="">Escolha o cliente</option>${D.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${c.id}"${c.id===cli?" selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
  <button class="link" style="align-self:flex-start" data-act="editCliente" data-volta="agendar">+ Cliente novo</button>
  <div class="f2"><label>Data<input type="date" id="ag-data" value="${s?s.data:(el.dataset.data||hoje())}"></label><label>Hora<input type="time" id="ag-hora" value="${s?esc(s.hora):""}"></label></div>
  <label>Serviço<select id="ag-tipo">${opt(TIPOS,s?s.tipo:"Limpeza completa")}</select></label>
  <label>Valor previsto (R$)<input id="ag-valor" inputmode="decimal" placeholder="em branco usa o preço padrão" value="${s?esc(s.valor):""}"></label>
  <label>Observação<input id="ag-obs" value="${s?esc(s.obs):""}"></label>
  <button class="btn btn-main" data-act="salvarAg" data-id="${s?s.id:""}">Salvar</button>
  <div class="btns">${s?`<button class="btn btn-danger" data-act="excluirServ" data-id="${s.id}">Excluir</button>`:""}<button class="btn" data-act="fechar">Cancelar</button></div>`)},
 salvarAg:el=>{const cli=$("#ag-cli").value,data=$("#ag-data").value;if(!cli)return toast("Escolha o cliente.");if(!data)return toast("Escolha a data.");
  const c=cliente(cli),tipo=$("#ag-tipo").value;let s=el.dataset.id?serv(el.dataset.id):null;
  const valor=$("#ag-valor").value.trim()?num($("#ag-valor").value):valorPadrao(tipo,c.aparelhos.length);
  if(!s){s={id:uid(),status:"agendado",pago:true,pagamento:"Pix",checklist:[],os:null,aparelhos:c.aparelhos.map(a=>a.id)};D.servicos.push(s)}
  if(s.cliente!==cli)s.aparelhos=c.aparelhos.map(a=>a.id);
  Object.assign(s,{cliente:cli,data,hora:$("#ag-hora").value,tipo,valor,obs:$("#ag-obs").value});salvar();fechar();st.view="hoje";st.dia=data;render();toast("Serviço agendado.")},
 excluirServ:el=>confirma(el,()=>{D.servicos=D.servicos.filter(s=>s.id!==el.dataset.id);salvar();fechar();if(st.view==="recibo")st.view="hoje";render();toast("Excluído.")}),
 concluir:el=>{const s=serv(el.dataset.id);st.os={servicoId:s.id,cliente:s.cliente,data:hoje(),tipo:s.tipo,aparelhos:s.aparelhos.slice(),checks:null,valor:s.valor,valorManual:true,pagamento:"Pix",obs:s.obs||""};st.view="os";render();scrollTo(0,0)},
 novaOS:el=>{st.os=novoRascunho(el.dataset.cli||"");st.view="os";render();scrollTo(0,0)},
 limparOS:()=>{st.os=null;render()},
 salvarOS:()=>{lerOS();const f=st.os;if(!f.cliente)return toast("Escolha o cliente.");
  let s=f.servicoId?serv(f.servicoId):null;if(!s){s={id:uid()};D.servicos.push(s)}
  Object.assign(s,{cliente:f.cliente,data:f.data,hora:s.hora||"",tipo:f.tipo,aparelhos:f.aparelhos,checklist:f.checks,valor:num(f.valor),pagamento:f.pagamento,pago:f.pagamento!=="A receber",obs:f.obs,status:"feito"});
  if(!s.os)s.os=D.nextOS++;const c=cliente(f.cliente);if(c)c.avisado="";
  st.os=null;st.reciboId=s.id;st.view="recibo";salvar();render();scrollTo(0,0);toast("OS concluída.")},
 recibo:el=>{st.reciboId=el.dataset.id;st.view="recibo";render();scrollTo(0,0)},
 copiar:async el=>{const t=reciboTexto(serv(el.dataset.id));try{await navigator.clipboard.writeText(t);toast("Texto copiado.")}catch(e){abrir(`<h2>Copie o texto</h2><textarea rows="12" readonly>${esc(t)}</textarea><button class="btn" data-act="fechar">Fechar</button>`);$("#sheet textarea").select()}},
 pago:el=>{const s=serv(el.dataset.id);s.pago=true;if(s.pagamento==="A receber")s.pagamento="Pix";salvar();render();toast("Marcado como pago.")},
 avisar:el=>{const c=cliente(el.dataset.id),u=ultima(c);const msg=tpl(D.cfg.msgAlerta,c,{data:br(u),meses:meses(u)});
  abrir(`<h2>Mensagem para ${esc(pnome(c.nome))}</h2><p class="sub">Você pode ajustar o texto antes de enviar.</p>
  <div class="wa-chat"><div class="bubble"><textarea id="av-msg" rows="6">${esc(msg)}</textarea></div></div>
  ${c.tel?`<button class="btn btn-main wa" data-act="enviarAviso" data-id="${c.id}">Enviar pelo WhatsApp</button>`:`<p class="sub">Cliente sem telefone. <button class="link" data-act="editCliente" data-id="${c.id}">Cadastrar</button></p>`}
  <div class="btns"><button class="btn btn-pri" data-act="agendar" data-cli="${c.id}">Já agendar</button><button class="btn" data-act="fechar">Fechar</button></div>`)},
 enviarAviso:el=>{const c=cliente(el.dataset.id);window.open(wa(c.tel,$("#av-msg").value),"_blank","noopener");c.avisado=hoje();salvar();fechar();render()},
 editCliente:el=>{const c=el.dataset.id?cliente(el.dataset.id):null;st.volta=el.dataset.volta||"";
  abrir(`<h2>${c?"Editar cliente":"Novo cliente"}</h2>
  <label>Nome<input id="c-nome" value="${c?esc(c.nome):""}" autocomplete="off"></label>
  <label>Telefone / WhatsApp<input id="c-tel" type="tel" value="${c?esc(c.tel):""}" placeholder="(91) 99999-9999"></label>
  <label>Endereço<input id="c-end" value="${c?esc(c.end):""}" placeholder="Rua, número"></label>
  <label>Bairro<input id="c-bairro" value="${c?esc(c.bairro):""}"></label>
  <label>Observação<input id="c-obs" value="${c?esc(c.obs):""}" placeholder="Ponto de referência, portão, horário…"></label>
  <button class="btn btn-main" data-act="salvarCliente" data-id="${c?c.id:""}">Salvar</button>
  <div class="btns">${c?`<button class="btn btn-danger" data-act="excluirCliente" data-id="${c.id}">Excluir cliente</button>`:""}<button class="btn" data-act="fechar">Cancelar</button></div>`)},
 salvarCliente:el=>{const nome=$("#c-nome").value.trim();if(!nome)return toast("Coloque o nome do cliente.");
  let c=el.dataset.id?cliente(el.dataset.id):null;if(!c){c={id:uid(),aparelhos:[],avisado:""};D.clientes.push(c)}
  Object.assign(c,{nome,tel:$("#c-tel").value.trim(),end:$("#c-end").value.trim(),bairro:$("#c-bairro").value.trim(),obs:$("#c-obs").value.trim()});salvar();
  if(st.volta==="agendar"){st.volta="";A.agendar({dataset:{cli:c.id}});return}
  fechar();st.view="cliente";st.cli=c.id;render();toast("Cliente salvo.");if(!c.aparelhos.length)setTimeout(()=>A.editAp({dataset:{}}),300)},
 excluirCliente:el=>confirma(el,()=>{const id=el.dataset.id;D.clientes=D.clientes.filter(c=>c.id!==id);D.servicos=D.servicos.filter(s=>s.cliente!==id);salvar();fechar();st.view="clientes";render();toast("Cliente excluído.")}),
 editAp:el=>{const c=cliente(st.cli);const a=el.dataset.id?c.aparelhos.find(x=>x.id===el.dataset.id):null;
  abrir(`<h2>${a?"Editar aparelho":"Novo aparelho"}</h2><p class="sub">${esc(c.nome)}</p>
  <div class="f2"><label>BTU<select id="a-btu">${opt(BTUS,a?a.btu:"12.000")}</select></label><label>Gás<select id="a-gas">${opt(GASES,a?a.gas:"R-410A")}</select></label></div>
  <label>Modelo<select id="a-mod">${opt(MODELOS,a?a.modelo:"Split hi-wall")}</select></label>
  <div class="f2"><label>Local<input id="a-local" value="${a?esc(a.local):""}" placeholder="Sala, quarto…"></label><label>Marca<input id="a-marca" value="${a?esc(a.marca):""}"></label></div>
  <button class="btn btn-main" data-act="salvarAp" data-id="${a?a.id:""}">Salvar aparelho</button>
  <div class="btns">${a?`<button class="btn btn-danger" data-act="excluirAp" data-id="${a.id}">Remover</button>`:""}<button class="btn" data-act="fechar">Fechar</button></div>`)},
 salvarAp:el=>{const c=cliente(st.cli);let a=el.dataset.id?c.aparelhos.find(x=>x.id===el.dataset.id):null;
  if(!a){a={id:uid()};c.aparelhos.push(a);D.servicos.forEach(s=>{if(s.cliente===c.id&&s.status!=="feito")s.aparelhos.push(a.id)})}
  Object.assign(a,{btu:$("#a-btu").value,gas:$("#a-gas").value,modelo:$("#a-mod").value,local:$("#a-local").value.trim(),marca:$("#a-marca").value.trim()});salvar();fechar();render();toast("Aparelho salvo.")},
 excluirAp:el=>confirma(el,()=>{const c=cliente(st.cli);c.aparelhos=c.aparelhos.filter(a=>a.id!==el.dataset.id);salvar();fechar();render()}),
 logo:()=>$("#logo-file").click(),
 tirarLogo:()=>{D.cfg.logo="";D.cfg.icone="";salvar();render()},
 exportar:()=>{const b=new Blob([JSON.stringify(D)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-"+(D.cfg.empresa||"clima").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-")+"-"+hoje()+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup salvo nos downloads.")},
 importar:()=>$("#imp-file").click(),
 zerar:el=>{abrir(`<h2>Começar do zero?</h2><p class="sub">Os clientes e serviços de exemplo serão apagados. O nome da empresa, a logo e os preços continuam.</p>
  <button class="btn btn-main" data-act="zerarOk">Apagar exemplos e começar</button><button class="btn" data-act="fechar">Cancelar</button>`)},
 zerarOk:()=>{D.clientes=[];D.servicos=[];D.nextOS=1;D.cfg.demo=false;salvar();fechar();st.view="mais";render();toast("Pronto. Comece cadastrando seus clientes.")},
 fechar:()=>fechar(),
 sair:el=>confirma(el,sair),
};
document.addEventListener("click",e=>{if(e.target.classList.contains("sheet-bg"))return fechar();
 const el=e.target.closest("[data-act]");if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener("input",e=>{const el=e.target;
 if(el.id==="q"){st.q=el.value;$("#cl").innerHTML=listaClientes();return}
 if(el.id==="os-valor"){st.os.valorManual=true;st.os.valor=el.value;$("#os-total").textContent=brl(num(el.value));return}
 if(el.dataset.cfg){const k=el.dataset.cfg;D.cfg[k]=el.type==="number"?(+el.value||0):el.value;salvar();if(k==="cor")document.documentElement.style.setProperty("--brand",el.value);if(["empresa","tecnico","cor"].includes(k))renderTop();return}
 if(el.dataset.preco){D.cfg.precos[el.dataset.preco]=num(el.value);salvar()}});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset.os)return;const f=st.os,antes={cli:f.cliente,tipo:f.tipo};lerOS();
 if(f.cliente!==antes.cli){const c=cliente(f.cliente);f.aparelhos=c?c.aparelhos.map(a=>a.id):[];f.valorManual=false}
 if(f.tipo!==antes.tipo)f.checks=null;
 if(!f.valorManual){const c=cliente(f.cliente);f.valor=c?valorPadrao(f.tipo,f.aparelhos.length):""}
 render()});
$("#logo-file").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=320,k=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);D.cfg.logo=cv.toDataURL("image/png");D.cfg.icone="";salvar();render();toast("Logo atualizada.")};img.src=r.result};r.readAsDataURL(file);e.target.value=""});
$("#imp-file").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;file.text().then(t=>{const d=JSON.parse(t);if(!d.clientes||!d.servicos)throw 0;D=d;D.cfg=Object.assign({},CFG0,d.cfg||{});D.cfg.precos=Object.assign({},CFG0.precos,D.cfg.precos||{});D.nextOS=D.nextOS||1;salvar();st.view="hoje";render();toast("Backup restaurado.")}).catch(()=>toast("Esse arquivo não é um backup do app."));e.target.value=""});
iniciar();
</script>
</body>
</html>
